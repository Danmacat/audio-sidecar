name: build-and-test

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux PulseAudio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libpulse-dev
      - run: cargo build --locked
      - run: cargo test --locked
